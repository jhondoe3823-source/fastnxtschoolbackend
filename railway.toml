# Railway: run migrations once per deploy (pre-deploy), not on every container restart.
# That avoids Prisma advisory-lock crash loops when Neon is slow or a prior migrate is stuck.
# Note: `releaseCommand` is not a valid Railway config key — use `preDeployCommand`.
[deploy]
preDeployCommand = ["npx prisma migrate deploy"]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
